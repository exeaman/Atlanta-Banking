spring:
  datasource:
    url: jdbc:h2:mem:auditdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN

jwt:
  secret: test-secret-key