server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false
        default_schema: audit

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.atlantabanking.audit: INFO

jwt:
  secret: ${JWT_SECRET}