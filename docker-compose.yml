name: ${COMPOSE_PROJECT_NAME}

services:
  audit-service:
    build:
      context: ./services/audit-service

    container_name: atlanta-audit-service

    restart: unless-stopped

    ports:
      - "${AUDIT_PORT}:8088"

    env_file:
      - ./config/docker/audit.env

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      service-registry:
        condition: service_healthy

    networks:
      - atlanta-network


  identity-service:
    build:
      context: ./services/identity-service

    container_name: atlanta-identity-service

    restart: unless-stopped

    ports:
      - "${IDENTITY_PORT}:8083"

    env_file:
      - ./config/docker/identity.env

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      service-registry:
        condition: service_healthy

    networks:
      - atlanta-network


  gateway-service:
    build:
      context: ./services/gateway-service

    container_name: atlanta-gateway-service

    restart: unless-stopped

    ports:
      - "${GATEWAY_PORT}:8080"

    env_file:
      - ./config/docker/gateway.env

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - atlanta-network



  service-registry:
    build:
      context: ./services/service-registry

    container_name: atlanta-service-registry

    restart: unless-stopped

    ports:
      - "${REGISTRY_PORT}:8761"

    networks:
      - atlanta-network

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    container_name: atlanta-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d

    networks:
      - atlanta-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:4.1.0
    container_name: atlanta-kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:${KAFKA_CONTROLLER_PORT}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - atlanta-network

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: atlanta-kafka-ui

    restart: unless-stopped

    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: Atlanta-Banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - atlanta-network


volumes:
  postgres-data:
  kafka-data:


networks:
  atlanta-network:
    name: ${DOCKER_NETWORK}
    driver: bridge