# =========================
# Server
# =========================
server.port=0
# =========================
# Database
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atlantabanking_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=identity
# =========================
# Eureka
# =========================
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health
# =========================
# Logging
# =========================
logging.level.root=WARN
logging.level.com.atlantabanking.identity=INFO
# =========================
# JWT
# =========================
jwt.secret=TestSecretKeyForJUnitOnly
jwt.expiration=900000