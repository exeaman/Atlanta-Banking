server.port=8083
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atlantabanking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=identity
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=*
logging.level.root=INFO
logging.level.com.atlantabanking.identity=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.com.netflix.discovery=INFO
logging.level.com.netflix.eureka=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
jwt.secret=${JWT_SECRET:AtlantaBankingIdentityServiceJwtSecretKeyForDevelopment2026}
jwt.expiration=900000
eureka.client.enabled=false